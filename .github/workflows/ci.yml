name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: test (${{ matrix.name }})
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: rocky9
            image: quay.io/rockylinux/rockylinux:9
            setup: |
              dnf -y install dnf-plugins-core
              dnf config-manager --set-enabled crb
              dnf -y install gcc git make tar gzip pkgconf-pkg-config libvirt-devel
          - name: rocky10
            image: quay.io/rockylinux/rockylinux:10
            setup: |
              dnf -y install dnf-plugins-core
              dnf config-manager --set-enabled crb
              dnf -y install gcc git make tar gzip pkgconf-pkg-config libvirt-devel
          - name: ubuntu26.04
            image: ubuntu:26.04
            setup: |
              apt-get update
              DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                ca-certificates gcc git make pkg-config libvirt-dev
    steps:
      - name: install build dependencies
        run: ${{ matrix.setup }}
      - uses: actions/checkout@v4
      - name: trust the checkout (container uid differs from the runner's)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - run: go vet ./...
      - run: go test ./...
      - run: make build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: install libvirt headers (cgo)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libvirt-dev
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.13
          install-only: true
      - run: make lint
      - name: ascii-only sources
        run: |
          if grep -rnP '[^\x00-\x7F]' --include='*.go' --include='Makefile' --include='*.yml' .; then
            echo "non-ASCII characters found" >&2
            exit 1
          fi
